name: CI - Pruebas y Cobertura

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-coverage:
    name: Pruebas Unitarias y Cobertura
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de pruebas
        run: |
          python -m pip install --upgrade pip
          pip install coverage

      - name: Ejecutar pruebas unitarias con Coverage
        run: |
          coverage run --source=pagos -m unittest discover -v

      - name: Generar reporte y validar cobertura minima (85%)
        run: |
          coverage report -m --fail-under=85
